name: Publish create-tess to npm

# Publishes the create-tess wizard package to npm.
#
# Deliberately a SEPARATE workflow from Release (.github/workflows/release.yml):
# release.yml fires on the whole-framework `v*` tags and cuts a GitHub Release
# for Tess OS itself. create-tess versions independently of the framework (it
# is a thin wizard shipped alongside it), so it is keyed on its OWN tag
# namespace (`create-tess-v*`), never the framework's `v*` tags — a
# `create-tess-v0.1.1` tag can never collide with, or be mistaken for, a
# framework release tag.
#
# WIRED, NOT FIRED (2026-07 hardening — the secret-leak fix in #30 landed
# 2026-06-29, but create-tess@0.1.0 on npm predates it at 2026-06-28, and the
# stale published version blocked a same-version re-publish). This workflow
# makes the publish path exist and pass its own gates; it does NOT publish
# anything on its own:
#   - fires only on a `create-tess-v*` tag, OR an explicit workflow_dispatch
#     where the operator types the exact version they intend to publish
#     (a deliberate manual confirmation step, not just a click-to-run button)
#   - the version gate below refuses to publish if the tag/input doesn't
#     match create-tess/package.json's version — protects against a stale tag
#     or a fat-fingered manual dispatch shipping the wrong version
#   - uses npm Trusted Publishing (OIDC, id-token: write) — no NPM_TOKEN
#     secret exists or is read by this workflow
#
# Until npm's Trusted Publisher is configured for this exact repo + this exact
# workflow file (npmjs.com package settings — Xavier's action, not code), the
# final `npm publish` step will fail closed with an auth error if it is ever
# actually triggered. That is the intended state until the npm-side setup is
# done and a real run is authorized — this workflow is deliberately inert
# until then.

on:
  push:
    tags:
      - 'create-tess-v*'
  workflow_dispatch:
    inputs:
      confirm_version:
        description: 'Exact version to publish (must match create-tess/package.json), e.g. 0.1.1'
        required: true

# Publishes are serialized; never cancel an in-flight publish.
concurrency:
  group: publish-npm-create-tess
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: npm publish create-tess
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm Trusted Publishing (OIDC) — no token
    defaults:
      run:
        working-directory: create-tess
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trusted Publishing requires npm CLI >= 11.5.1 and Node.js >= 22.14.0.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure npm >= 11.5.1 (required for Trusted Publishing / OIDC)
        run: npm install -g npm@latest

      # ----------------------------------------------------------------------
      # Gate — the tag (or the manual-dispatch confirmation input) MUST match
      # create-tess/package.json's version exactly. Fail closed on mismatch so
      # a stale tag or a fat-fingered dispatch can never publish the wrong
      # version, or silently no-op into publishing whatever HEAD happens to be.
      # ----------------------------------------------------------------------
      # Expression values are passed through `env:` and read as quoted shell
      # variables below — never interpolated directly into the script — so a
      # crafted workflow_dispatch input can't inject shell commands.
      - name: Resolve expected version
        id: version
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            WANT="$CONFIRM_VERSION"
          else
            WANT="${GITHUB_REF_NAME#create-tess-v}"
          fi
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "want_version=$WANT" >> "$GITHUB_OUTPUT"
          echo "create-tess/package.json version: $PKG_VERSION"
          echo "Requested/tagged version:         $WANT"

      - name: Gate — tag/input version must match create-tess/package.json
        env:
          PKG_VERSION: ${{ steps.version.outputs.pkg_version }}
          WANT_VERSION: ${{ steps.version.outputs.want_version }}
        run: |
          set -euo pipefail
          if [ "$PKG_VERSION" != "$WANT_VERSION" ]; then
            echo "::error::version mismatch — create-tess/package.json is $PKG_VERSION but the trigger asked for $WANT_VERSION. Refusing to publish (fail closed)."
            exit 1
          fi
          echo "OK: version gate passed ($PKG_VERSION)."

      - name: Install dependencies
        run: npm ci

      # Smoke gate — the same suite exercised locally (scaffold → gate
      # activation → doctor/verify). Must pass before anything is published.
      - name: create-tess smoke test (node --test)
        run: npm test

      # All gates passed. Trusted Publishing auto-detects the OIDC token from
      # `id-token: write` — no NODE_AUTH_TOKEN / NPM_TOKEN is configured or
      # needed. Provenance attestations are generated automatically by npm
      # when publishing via Trusted Publishing (no --provenance flag needed).
      - name: npm publish (Trusted Publishing / OIDC)
        run: npm publish --access public
