name: Publish create-tess to npm

# Publishes the create-tess wizard package to npm.
#
# Deliberately a SEPARATE workflow from Release (.github/workflows/release.yml):
# release.yml fires on the whole-framework `v*` tags and cuts a GitHub Release
# for Tess OS itself. create-tess versions independently of the framework (it
# is a thin wizard shipped alongside it), so it is keyed on its OWN tag
# namespace (`create-tess-v*`), never the framework's `v*` tags.
#
# v0.2.1 hardening. A publish happens only when ALL of these hold:
#   - the trigger is a pushed `create-tess-v*` tag. There is no
#     workflow_dispatch: a button cannot publish, only a signed tag can.
#   - the tag is annotated and signed by the pinned Tess OS release key
#     (EBEABC618C11B6A7340A7D1601DD637667B8CC89, the same fingerprint as
#     tess.lock framework.trusted_key_fingerprint), checked by
#     .github/scripts/verify_release_tag.sh in a throwaway GNUPGHOME.
#   - the tag version equals create-tess/package.json's version.
#   - the job runs in the `npm-publish` GitHub environment. That environment
#     is created in the repository settings with a tag-only deployment rule
#     (`create-tess-v*`) and no required reviewers (SECURITY.md, "Trust
#     model": the signed tag is the approval); the npm Trusted Publisher for create-tess must name
#     this workflow file AND this environment, so a run outside it cannot mint
#     the OIDC publish credential.
#   - npm is pinned (NPM_VERSION below), the same npm ci.yml's create-tess
#     leg runs the tests with, never the floating "latest" dist-tag.
#   - `npm test` passes, including the packed-tarball scaffold test.
# Trusted Publishing (OIDC, id-token: write): no NPM_TOKEN exists or is read.

on:
  push:
    tags:
      - 'create-tess-v*'

# Publishes are serialized; never cancel an in-flight publish.
concurrency:
  group: publish-npm-create-tess
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Trusted Publishing needs npm >= 11.5.1 and Node >= 22.14. npm 12.1.0
  # requires Node ^22.22.2 || ^24.15.0. Keep in step with ci.yml.
  NPM_VERSION: '12.1.0'

jobs:
  publish:
    name: npm publish create-tess
    runs-on: ubuntu-latest
    # The `npm-publish` environment only admits `create-tess-v*` TAG refs
    # (deployment policy, no reviewers). npm Trusted Publishing is bound to
    # this environment, so a branch run (or a copy of this workflow wired to
    # another trigger) cannot obtain a publish-capable OIDC token.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # required for npm Trusted Publishing (OIDC) — no token
    defaults:
      run:
        working-directory: create-tess
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      # Gate 0: the release key is the single root of trust (SECURITY.md,
      # "Trust model"). Refuse anything that is not a `create-tess-v*` tag ref
      # (fail closed even if the trigger is ever widened), then require an
      # annotated tag signed by the pinned key EBEABC618C11B6A7340A7D1601DD637667B8CC89.
      # actions/checkout turns an annotated tag into a lightweight ref; fetch
      # the real tag object before verifying it. The tag name only reaches the
      # shell through the TAG environment variable (no expression injection).
      - name: Gate 0 — tag must be signed by the Twiss release key
        working-directory: .
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [[ "$TAG" != create-tess-v* ]]; then
            echo "::error::publish must run on a create-tess-v* tag (got ${GITHUB_REF_TYPE} '${TAG}'). Refusing (fail closed)."
            exit 1
          fi
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          .github/scripts/verify_release_tag.sh "$TAG"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned npm
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Gate — tag version must match create-tess/package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          WANT="${TAG#create-tess-v}"
          if [ "$PKG_VERSION" != "$WANT" ]; then
            echo "::error::version mismatch — create-tess/package.json is $PKG_VERSION but the tag is $TAG. Refusing to publish."
            exit 1
          fi
          echo "OK: version gate passed ($PKG_VERSION)."

      - name: Set up Python (tessctl + onboarding in the scaffold tests)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # Same suite as ci.yml's pinned-npm leg: scaffold, gate activation,
      # onboarding, doctor/verify, and a scaffold from the real packed tarball.
      - name: create-tess tests (node --test)
        run: npm test

      # Provenance attestations are generated automatically with Trusted Publishing.
      - name: npm publish (Trusted Publishing / OIDC)
        run: npm publish --access public
