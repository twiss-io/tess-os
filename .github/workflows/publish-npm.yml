name: Publish create-tess to npm

# npm publication is a separate, explicit owner action after a successful
# signed framework release. It never publishes from a branch, an independent
# create-tess tag, or an arbitrary checkout.
on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: 'Released stable version to publish (X.Y.Z)'
        required: true
        type: string

concurrency:
  group: publish-npm-create-tess
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: npm publish create-tess
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      checks: read
      id-token: write
    steps:
      # The workflow and validator come from protected main. The release
      # environment must externally restrict deployments to protected main.
      - name: Checkout trusted publication control from main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Checkout the confirmed release tag as candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: v${{ inputs.confirm_version }}
          path: candidate
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch protected main in candidate repository
        working-directory: candidate
        run: git fetch --force origin +refs/heads/main:refs/remotes/origin/main

      - name: Gate 1 — release tag equals dispatched and fetched protected main
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TAG: v${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          python control/scripts/release_preflight.py source \
            --repo candidate \
            --tag "$TAG" \
            --main-ref origin/main \
            --expected-sha "$EXPECTED_SHA"

      - name: Gate 2 — exact protected signer identity
        env:
          TAG: v${{ inputs.confirm_version }}
          TESS_SIGNING_PUBKEY: ${{ secrets.TESS_SIGNING_PUBKEY }}
          TESS_RELEASE_SIGNER_FINGERPRINT: ${{ vars.TESS_RELEASE_SIGNER_FINGERPRINT }}
        run: python control/scripts/release_preflight.py signer --repo candidate --tag "$TAG"

      - name: Gate 3 — unified release version contract
        env:
          TAG: v${{ inputs.confirm_version }}
        run: python control/scripts/release_preflight.py metadata --repo candidate --tag "$TAG"

      - name: Gate 4 — workflow and GUI non-publication boundaries
        run: python control/scripts/release_preflight.py workflows --repo candidate

      - name: Gate 5 — successful framework release and secret scan on exact source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C candidate rev-parse HEAD)"
          checks_file="$RUNNER_TEMP/check-runs.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/check-runs?filter=latest&per_page=100" \
            > "$checks_file"
          python control/scripts/release_preflight.py checks \
            --input "$checks_file" \
            --sha "$SOURCE_SHA" \
            --required 'Publish GitHub Release' \
            --required 'secret scan (gitleaks)'
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            > /dev/null

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: candidate/create-tess/package-lock.json

      - name: Gate 6 — Trusted Publishing npm CLI floor
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          python - "$npm_version" <<'PY'
          import sys

          parts = sys.argv[1].split('.')
          if len(parts) < 3 or not all(part.isdigit() for part in parts[:3]):
              raise SystemExit(f'cannot parse npm version: {sys.argv[1]}')
          if tuple(map(int, parts[:3])) < (11, 5, 1):
              raise SystemExit(f'npm {sys.argv[1]} is below Trusted Publishing minimum 11.5.1')
          print(f'OK: npm {sys.argv[1]} supports Trusted Publishing')
          PY

      - name: Gate 7 — install create-tess dependencies without lifecycle scripts
        working-directory: candidate/create-tess
        run: npm ci --ignore-scripts

      - name: Gate 8 — create-tess tests
        working-directory: candidate/create-tess
        run: npm test

      - name: Gate 9 — credential-free package manifest assertions
        run: python control/scripts/release_preflight.py packs --repo candidate

      # Trusted Publishing requests the OIDC credential only here. Lifecycle
      # scripts remain disabled, no NPM_TOKEN is configured or read, and every
      # source/signature/version/release gate above must have succeeded first.
      - name: Publish create-tess through npm Trusted Publishing
        working-directory: candidate/create-tess
        run: npm publish --ignore-scripts --access public
