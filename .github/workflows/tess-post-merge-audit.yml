# tess-post-merge-audit v1
# Evidence only: this job runs after a merge has already landed on main.
# It can detect/report a topology or gate-evidence failure, but it never
# authorizes a PR and never claims it prevented the merge.
name: Tess OS post-merge audit

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  post-merge-audit:
    name: tessctl gate post-merge-audit (evidence only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landed main history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.7"

      - name: Resolve landed push objects
        id: refs
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::POST_MERGE_PUSH_REQUIRED: evidence audit accepts only target-main push events."
            exit 1
          fi
          BASE="${{ github.event.before }}"
          EVALUATION="${{ github.event.after }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::REMOTE_BASE_REQUIRED: post-merge audit needs the pre-existing main commit."
            exit 1
          fi
          if [ "$EVALUATION" != "$GITHUB_SHA" ]; then
            echo "::error::POST_MERGE_EVENT_RANGE_MISMATCH: event after must equal GITHUB_SHA."
            exit 1
          fi
          {
            echo "base=$BASE"
            echo "evaluation=$EVALUATION"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch exact landed objects
        run: |
          set -euo pipefail
          BASE="${{ steps.refs.outputs.base }}"
          EVALUATION="${{ steps.refs.outputs.evaluation }}"
          git fetch --no-tags --force origin "$BASE" "$EVALUATION"
          git cat-file -e "${BASE}^{commit}"
          git cat-file -e "${EVALUATION}^{commit}"
          test "$(git rev-list --parents -n 1 "$EVALUATION" | awk '{print NF}')" -eq 3

      - name: Extract trusted gate dependencies (base ref only)
        id: trusted_dependencies
        run: |
          set -euo pipefail
          BASE="${{ steps.refs.outputs.base }}"
          REQUIREMENTS_REL=".tess/ci/ship-gate-requirements.txt"
          TRUSTED_DIR="$(mktemp -d)"
          TRUSTED_REQUIREMENTS="$TRUSTED_DIR/ship-gate-requirements.txt"
          if git cat-file -e "${BASE}:${REQUIREMENTS_REL}" 2>/dev/null; then
            git show "${BASE}:${REQUIREMENTS_REL}" > "$TRUSTED_REQUIREMENTS"
            chmod 0444 "$TRUSTED_REQUIREMENTS"
            echo "requirements_path=$TRUSTED_REQUIREMENTS" >> "$GITHUB_OUTPUT"
          else
            echo "::error::TRUST_BOOTSTRAP_REQUIRED: immutable BASE has no pinned ship-gate dependencies."
            exit 1
          fi

      - name: Install exact trusted gate dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "${{ steps.trusted_dependencies.outputs.requirements_path }}"

      - name: Extract trusted gate engine (base ref only)
        id: trusted_engine
        run: |
          set -euo pipefail
          BASE="${{ steps.refs.outputs.base }}"
          TRUSTED_DIR="$(mktemp -d)"
          if git cat-file -e "$BASE:.tess/bin/tessctl" 2>/dev/null; then
            git show "$BASE:.tess/bin/tessctl" > "$TRUSTED_DIR/tessctl"
            chmod +x "$TRUSTED_DIR/tessctl"
            echo "engine_path=$TRUSTED_DIR/tessctl" >> "$GITHUB_OUTPUT"
          else
            echo "::error::TRUST_BOOTSTRAP_REQUIRED: immutable BASE has no post-merge-audit-capable gate engine."
            exit 1
          fi

      - name: tessctl gate post-merge-audit (evidence only)
        env:
          TESS_ROOT: ${{ github.workspace }}
          TESS_JOB_CONTEXT_JSON: ${{ toJSON(job) }}
        run: |
          python3 "${{ steps.trusted_engine.outputs.engine_path }}" gate post-merge-audit \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.evaluation }}" \
            --json
