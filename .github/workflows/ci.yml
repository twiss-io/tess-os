name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Manual full run. `macos: false` limits it to the Linux jobs.
  workflow_dispatch:
    inputs:
      macos:
        description: "Run the macOS legs too"
        type: boolean
        default: true

# PR runs: one group per workflow + PR number, superseded runs cancel, and one
# PR never cancels another. Feature-branch pushes: one group per workflow + ref,
# superseded runs cancel. Runs on main, release/** and rc/** pushes, and every
# manual dispatch get a group unique to the run (run_id), so they never cancel
# or queue behind each other (a shared group would keep only one pending run and
# silently drop the middle one when merges land quickly). This workflow only
# validates; the signing, release and publish workflows have their own
# concurrency rules and are untouched.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
      || (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
          || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/rc/'))
         && format('run-{0}', github.run_id)
      || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/rc/')) }}

permissions:
  contents: read

jobs:
  # Decides only whether the macOS legs run (they are about 85% of CI's gross
  # runner cost and none is a required check) and whether the macOS py3.12 pytest
  # leg joins the py3.9 leg. Every Linux job below, including every required
  # status check, runs on every event and does not depend on this job. If this job
  # fails or is skipped the macOS legs run, both Pythons (fail closed).
  # Rules and the change-to-check table: .github/scripts/ci_plan.py and
  # tests/test_ci_plan.py.
  plan:
    name: plan (macOS legs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.plan.outputs.macos }}
      macos_pythons: ${{ steps.plan.outputs.macos_pythons }}
      conformance_os: ${{ steps.plan.outputs.conformance_os }}
    steps:
      - name: Checkout (full history and all branch refs, for the cumulative diff and the nearest-base lookup)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PUSH_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          DISPATCH_MACOS: ${{ inputs.macos }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -B .github/scripts/ci_plan.py

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # DoD B.9 wedge-loop e2e (tests/orchestrator/test_e2e_wedge_loop.py)
      # HARD-REQUIRES a real `node` binary and deliberately does not
      # `pytest.mark.skipif(not HAS_NODE, ...)` the way tests/spec_engine/
      # test_codegen_app_boots.py's own, separate boot tests choose to for
      # local-dev convenience — a flagship "show me the receipt" e2e proof
      # that silently skips in CI would report green without ever actually
      # running. This step makes that hard requirement explicit and
      # verifiable rather than relying on whatever Node happens to be
      # pre-baked into the runner image.
      # tess-os #165 (Cyra + Reid, post-#164 follow-up): '20' reached EOL
      # 2026-04-30 (CI's own job log was already flagging "Node 20 is being
      # deprecated"). Bumped to '22' -- a supported LTS.
      #
      # Deliberately '22', NOT '24' (the `create-tess` job's own matrix
      # below tests against 24, but this job's Node also runs `node --test
      # <path>` against the Python-side generated apps in tests/spec_engine/
      # test_codegen_app_boots.py and tests/orchestrator/test_e2e_wedge_
      # loop.py, both of which assert on the literal `# fail 0` / `# pass`
      # TAP-format summary lines `node --test` prints on a non-TTY stream).
      # Verified empirically (piping `node --test` through a non-TTY
      # subprocess, matching how Python's subprocess.run(capture_output=
      # True) invokes it): Node 20 AND Node 22 both still default to the
      # `tap` reporter on a non-TTY stream (`# fail 0`, `# pass N`) --
      # Node 24 silently switched its non-TTY default to the `spec`
      # reporter (`✔`/`ℹ` icons, no `# `-prefixed summary at all), which
      # breaks both of those assertions outright. '22' preserves the exact
      # output format those two tests already depend on; '24' does not.
      - name: Set up Node (required by tests/orchestrator/test_e2e_wedge_loop.py)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # tests/test_v1_first_push_release_proof.py builds the real npm tarball and
      # SKIPS unless create-tess/node_modules exists. Install it before pytest,
      # then fail the step if that file reports SKIPPED (v1.0 code review, HIGH):
      # the first-push release proof must run, not pass by skipping.
      - name: Install create-tess dependencies (first-push release proof needs them)
        run: npm ci --prefix create-tess

      # The py3.12 leg also records every shell command the suite hands the
      # gate (tests/gate_corpus_recorder.py) for the shell-conformance job.
      - name: Run test suite (pytest)
        env:
          TESS_RECORD_GATE_CORPUS: ${{ matrix.python-version == '3.12' && format('{0}/gate-corpus.jsonl', runner.temp) || '' }}
        run: |
          set -euo pipefail
          python -m pytest -rs --durations=25 -p gate_corpus_recorder | tee "$RUNNER_TEMP/pytest.log"
          if grep -E "SKIPPED.*test_v1_first_push_release_proof" "$RUNNER_TEMP/pytest.log"; then
            echo "::error::tests/test_v1_first_push_release_proof.py was skipped; it must run in CI"
            exit 1
          fi

      # E8: the gate's hook tests share fake OS homes and anchors; a parallel run
      # once hid a "no decision" behind a test-isolation fault. Run every
      # gate-loading test file under pytest-xdist too (the step above runs them
      # serially), and the OS-home consistency test with two workers.
      - name: Gate tests under pytest-xdist (E8)
        run: |
          set -euo pipefail
          files="$( { grep -lE 'tess-gate\.py|run-pinned\.py|from test_codex_gate import|from test_v1_claude_gate_parity import' tests/*.py; \
                     printf '%s\n' tests/test_v1_gate_git_routes.py tests/test_v1_b1_hook_and_anchor_display.py tests/test_e8_fail_closed.py; } | sort -u )"
          echo "$files" | wc -l
          python -m pytest -q -rs -p no:cacheprovider -n 4 $files
          python -m pytest -q -rs -p no:cacheprovider -n 2 tests/test_e8_suite_os_home_consistency.py

      - name: Upload the recorded gate corpus
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-corpus
          path: ${{ runner.temp }}/gate-corpus.jsonl
          if-no-files-found: error
          retention-days: 7

      # Independent, explicit proof (on top of the full-suite run above)
      # that the DoD B.9 e2e genuinely EXECUTED its 3 cases in this CI run
      # rather than silently skipping — fails the job loudly if it sees
      # any SKIPPED report for this file, which should be structurally
      # impossible given `_require_node`'s hard-fail-not-skip behavior,
      # but this step makes that guarantee independently checkable from
      # the CI log itself rather than only from the source.
      - name: Verify DoD B.9 wedge-loop e2e actually ran (not skipped)
        run: |
          set -euo pipefail
          python -m pytest tests/orchestrator/test_e2e_wedge_loop.py -v | tee /tmp/e2e-wedge-loop.log
          if grep -q "SKIPPED" /tmp/e2e-wedge-loop.log; then
            echo "::error::DoD B.9 wedge-loop e2e reported a SKIPPED case — this must never happen in CI (node is required, see the 'Set up Node' step above)."
            exit 1
          fi
          grep -q "3 passed" /tmp/e2e-wedge-loop.log

      - name: tessctl doctor (SHA-integrity gate)
        env:
          TESS_ROOT: ${{ github.workspace }}
        run: python3 -I -B .tess/bin/tessctl doctor

      - name: tessctl verify (security-tier gate)
        env:
          TESS_ROOT: ${{ github.workspace }}
        run: python3 -I -B .tess/bin/tessctl verify

  # Real-shell conformance (v1.0.x round 4): every command the gate allows,
  # from the attack corpus and from the commands the test suite hands it
  # (recorded by the py3.12 test leg), runs in real bash and zsh inside a
  # disposable sandbox jailed by bwrap (Linux) or sandbox-exec (macOS); a
  # changed protected control file fails the job. TESS_CONFORMANCE_REQUIRED
  # turns every "cannot run here" skip into a failure.
  shell-conformance:
    name: shell conformance (${{ matrix.os }})
    needs: [test, plan]
    # Same condition as before (the test job must pass) without being skipped by
    # a failed plan job. The macOS leg is dropped only when the plan says so;
    # a missing plan output runs both legs.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.conformance_os || '["ubuntu-latest","macos-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
      # bwrap needs one. The runner is disposable, so the restriction is lifted.
      - name: Install zsh and bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q zsh bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --unshare-net true

      - name: Shells under test
        run: |
          set -euo pipefail
          /bin/bash --version | head -1
          zsh --version
          if command -v bash >/dev/null; then bash --version | head -1; fi

      - name: Download the recorded gate corpus
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gate-corpus
          path: ${{ runner.temp }}/gate-corpus

      - name: Real-shell conformance
        env:
          TESS_CONFORMANCE_REQUIRED: '1'
          TESS_CONFORMANCE_CORPUS: ${{ runner.temp }}/gate-corpus
        run: python -m pytest -v -rs tests/test_v1_shell_conformance.py

  create-tess:
    name: create-tess tests (node ${{ matrix.node-version }}${{ matrix.npm-version && format(', npm {0}', matrix.npm-version) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: create-tess
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '24']
        include:
          # The exact npm publish-npm.yml publishes with (its NPM_VERSION).
          # Keep the two in step: tests/test_v021_release_pipeline.py checks it.
          - node-version: '24'
            npm-version: '12.1.0'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: create-tess/package-lock.json

      - name: Install pinned npm
        if: matrix.npm-version
        env:
          NPM_VERSION: ${{ matrix.npm-version }}
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite (node --test)
        run: npm test

  # A stock Mac: /usr/bin/python3 is Apple's 3.9 with no PyYAML. pytest runs
  # on a setup-python interpreter; the packed-tarball scaffold test and the
  # fresh-install e2e run the wizard with /usr/bin/python3 first on PATH, so
  # tessctl and onboarding must work without any pip install.
  #
  # The py3.9 leg is the macOS leg that matters: it runs the stock-Python steps
  # (they ignore the matrix Python, so the py3.12 leg ran them a second time for
  # nothing) and the gate tests under Apple's own /usr/bin/python3 3.9.6, the
  # interpreter a stock Mac's hooks run. The py3.12 leg adds only pytest and runs
  # only when the plan asks for it (PR to main, push to main, manual dispatch).
  macos:
    name: macOS (py${{ matrix.python-version }}${{ matrix.python-version == '3.9' && ', stock /usr/bin/python3 install' || '' }})
    needs: plan
    # Runs unless the plan job succeeded and said no (macos == 'false'). A failed or
    # skipped plan job, or a missing output, therefore runs the macOS legs (fail closed).
    if: ${{ !cancelled() && (needs.plan.result != 'success' || needs.plan.outputs.macos != 'false') }}
    runs-on: macos-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # A missing plan output runs both legs (fail closed).
        python-version: ${{ fromJSON(needs.plan.outputs.macos_pythons || '["3.9","3.12"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Stock /usr/bin/python3 really lacks PyYAML
        if: matrix.python-version == '3.9'
        run: |
          /usr/bin/python3 --version
          if /usr/bin/python3 -c 'import yaml' 2>/dev/null; then
            echo "::error::this runner's /usr/bin/python3 has PyYAML; the stock-macOS leg would prove nothing"
            exit 1
          fi

      # tests/test_v1_first_push_release_proof.py builds the real npm tarball and
      # SKIPS unless create-tess/node_modules exists. Install it before pytest,
      # then fail the step if that file reports SKIPPED (v1.0 code review, HIGH):
      # the first-push release proof must run, not pass by skipping.
      - name: Install create-tess dependencies (first-push release proof needs them)
        run: npm ci --prefix create-tess

      # macOS arm64 runners have 3 vCPUs. `-n 3` (pytest-xdist, in requirements-dev.txt)
      # should cut this step from about 104 minutes to an estimated 40-50. The full
      # suite has passed under -n 4 and -n 8 since the E8 isolation fix, and the Linux
      # E8 step runs the gate files under xdist on every push. A test that cannot share
      # a worker should be serialised with an explicit marker, not drop -n.
      - name: Run test suite (pytest, -n 3)
        run: |
          set -euo pipefail
          python -m pytest -rfEs -n 3 | tee "$RUNNER_TEMP/pytest.log"
          if grep -E "SKIPPED.*test_v1_first_push_release_proof" "$RUNNER_TEMP/pytest.log"; then
            echo "::error::tests/test_v1_first_push_release_proof.py was skipped; it must run in CI"
            exit 1
          fi

      # Gate-focused tests under Apple's own /usr/bin/python3 (3.9.6). The only
      # Linux-invisible product bug so far (a gate bypass, fixed in 496f319) showed
      # up on a patch release of 3.9 that setup-python does not install: stock-Mac
      # users' hooks run under /usr/bin/python3. pytest is installed into a throwaway
      # venv made from that interpreter, so /usr/bin/python3 itself stays stock.
      # Keep this list small; it must equal APPLE_GATE_TESTS in ci_plan.py (tests/test_ci_plan.py checks).
      - name: Gate tests under Apple's /usr/bin/python3
        if: matrix.python-version == '3.9'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          /usr/bin/python3 --version
          # The step promises Apple's 3.9: fail rather than quietly test another interpreter.
          /usr/bin/python3 -c 'import sys; sys.exit(0 if sys.version_info[:2] == (3, 9) else 1)' \
            || { echo "::error::/usr/bin/python3 is not Apple's 3.9 on this runner image"; exit 1; }
          /usr/bin/python3 -m venv "$RUNNER_TEMP/apple-py"
          "$RUNNER_TEMP/apple-py/bin/python" -m pip install --quiet --disable-pip-version-check -r requirements-dev.txt
          "$RUNNER_TEMP/apple-py/bin/python" -I -B -m pytest -q -rfEs -p no:cacheprovider -n 3 \
            tests/test_v1_b1_class.py tests/test_v1_round4_shell_model.py tests/test_v1_r6_gate_expand.py \
            tests/test_hook_pinning.py tests/test_e8_fail_closed.py tests/test_v1_r2_isolation.py

      - name: create-tess tests, wizard on stock /usr/bin/python3
        if: matrix.python-version == '3.9'
        working-directory: create-tess
        env:
          TESS_TEST_PYTHON: /usr/bin/python3
        run: |
          npm ci
          npm test

      - name: Fresh-install e2e from the packed tarball, stock /usr/bin/python3
        if: matrix.python-version == '3.9'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          (cd create-tess && npm pack --pack-destination "$RUNNER_TEMP/pack" >/dev/null)
          export TESS_E2E_TARBALL="$(ls "$RUNNER_TEMP"/pack/create-tess-*.tgz)"
          TESS_BRAIN_E2E=1 TESS_E2E_PYTHON=/usr/bin/python3 python -m pytest -q tests/test_brain_fresh_install_e2e.py

  # The opt-in fresh-install e2e (tests/test_brain_fresh_install_e2e.py), run
  # from the real `npm pack` tarball on Linux too.
  fresh-install-e2e:
    name: fresh-install e2e (packed tarball)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Fresh-install e2e from the packed tarball
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          (cd create-tess && npm pack --pack-destination "$RUNNER_TEMP/pack" >/dev/null)
          export TESS_E2E_TARBALL="$(ls "$RUNNER_TEMP"/pack/create-tess-*.tgz)"
          TESS_BRAIN_E2E=1 python -m pytest -v tests/test_brain_fresh_install_e2e.py | tee "$RUNNER_TEMP/e2e.log"
          if grep -q SKIPPED "$RUNNER_TEMP/e2e.log"; then echo "::error::fresh-install e2e skipped"; exit 1; fi

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Run the gitleaks CLI directly. The gitleaks-action@v2 wrapper now requires
      # a paid GITLEAKS_LICENSE secret for GitHub *organization*-owned repos (this
      # repo is org-owned), so the wrapper is not used. The CLI is free and applies
      # the committed .gitleaks.toml allowlist.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
          gitleaks version

      # `gitleaks git <path>` with NO --log-opts does not just scan this ref's
      # own ancestry — on a fetch-depth:0 clone (needed so `origin/<base>` and
      # historic commits are available at all) it falls back to walking every
      # ref reachable in the local object store. Verified: on this repo's own
      # main, `git log HEAD --oneline | wc -l` reports 45 commits, but
      # `gitleaks git .` with no --log-opts reports "184 commits scanned" —
      # i.e. it silently scans every other branch fetched alongside main too.
      # That is the false-positive: an unrelated open PR's own (allowlisted,
      # on ITS branch) test fixture can fail THIS ref's scan even though it
      # never touches this ref's history. An explicit --log-opts commit range
      # scopes gitleaks correctly (proven: HEAD~2..HEAD scans exactly 2
      # commits, no cross-branch leakage) — so always pass one:
      #   - pull_request: only the PR's own commits, base..head
      #   - push:         only the commits this push introduced, before..after
      #   - push with no "before" (brand-new branch/tag): fall back to just
      #     the tip commit — there is no prior ref to diff against
      - name: Compute scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="${BEFORE_SHA}..${HEAD_SHA}"
          else
            LOG_OPTS="-1"
          fi
          echo "Scanning range: $LOG_OPTS"
          echo "log_opts=${LOG_OPTS}" >> "$GITHUB_OUTPUT"

      - name: gitleaks (this ref's own commits only)
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: gitleaks git . --config .gitleaks.toml --log-opts="${LOG_OPTS}" --redact --no-banner --exit-code 1
