name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite (pytest)
        run: python -m pytest

      - name: tessctl doctor (SHA-integrity gate)
        env:
          TESS_ROOT: ${{ github.workspace }}
        run: python3 .tess/bin/tessctl doctor

      - name: tessctl verify (security-tier gate)
        env:
          TESS_ROOT: ${{ github.workspace }}
        run: python3 .tess/bin/tessctl verify

  create-tess:
    name: create-tess tests (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: create-tess
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: create-tess/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite (node --test)
        run: npm test

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the gitleaks CLI directly. The gitleaks-action@v2 wrapper now requires
      # a paid GITLEAKS_LICENSE secret for GitHub *organization*-owned repos (this
      # repo is org-owned), so the wrapper is not used. The CLI is free and applies
      # the committed .gitleaks.toml allowlist.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # `gitleaks git <path>` with NO --log-opts does not just scan this ref's
      # own ancestry — on a fetch-depth:0 clone (needed so `origin/<base>` and
      # historic commits are available at all) it falls back to walking every
      # ref reachable in the local object store. Verified: on this repo's own
      # main, `git log HEAD --oneline | wc -l` reports 45 commits, but
      # `gitleaks git .` with no --log-opts reports "184 commits scanned" —
      # i.e. it silently scans every other branch fetched alongside main too.
      # That is the false-positive: an unrelated open PR's own (allowlisted,
      # on ITS branch) test fixture can fail THIS ref's scan even though it
      # never touches this ref's history. An explicit --log-opts commit range
      # scopes gitleaks correctly (proven: HEAD~2..HEAD scans exactly 2
      # commits, no cross-branch leakage) — so always pass one:
      #   - pull_request: only the PR's own commits, base..head
      #   - push:         only the commits this push introduced, before..after
      #   - push with no "before" (brand-new branch/tag): fall back to just
      #     the tip commit — there is no prior ref to diff against
      - name: Compute scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="${BEFORE_SHA}..${HEAD_SHA}"
          else
            LOG_OPTS="-1"
          fi
          echo "Scanning range: $LOG_OPTS"
          echo "log_opts=${LOG_OPTS}" >> "$GITHUB_OUTPUT"

      - name: gitleaks (this ref's own commits only)
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: gitleaks git . --config .gitleaks.toml --log-opts="${LOG_OPTS}" --redact --no-banner --exit-code 1
