name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # DoD B.9 wedge-loop e2e (tests/orchestrator/test_e2e_wedge_loop.py)
      # HARD-REQUIRES a real `node` binary and deliberately does not
      # `pytest.mark.skipif(not HAS_NODE, ...)` the way tests/spec_engine/
      # test_codegen_app_boots.py's own, separate boot tests choose to for
      # local-dev convenience — a flagship "show me the receipt" e2e proof
      # that silently skips in CI would report green without ever actually
      # running. This step makes that hard requirement explicit and
      # verifiable rather than relying on whatever Node happens to be
      # pre-baked into the runner image.
      # tess-os #165 (Cyra + Reid, post-#164 follow-up): '20' reached EOL
      # 2026-04-30 (CI's own job log was already flagging "Node 20 is being
      # deprecated"). Bumped to '22' -- a supported LTS.
      #
      # Deliberately '22', NOT '24' (the `create-tess` job's own matrix
      # below tests against 24, but this job's Node also runs `node --test
      # <path>` against the Python-side generated apps in tests/spec_engine/
      # test_codegen_app_boots.py and tests/orchestrator/test_e2e_wedge_
      # loop.py, both of which assert on the literal `# fail 0` / `# pass`
      # TAP-format summary lines `node --test` prints on a non-TTY stream).
      # Verified empirically (piping `node --test` through a non-TTY
      # subprocess, matching how Python's subprocess.run(capture_output=
      # True) invokes it): Node 20 AND Node 22 both still default to the
      # `tap` reporter on a non-TTY stream (`# fail 0`, `# pass N`) --
      # Node 24 silently switched its non-TTY default to the `spec`
      # reporter (`✔`/`ℹ` icons, no `# `-prefixed summary at all), which
      # breaks both of those assertions outright. '22' preserves the exact
      # output format those two tests already depend on; '24' does not.
      - name: Set up Node (required by tests/orchestrator/test_e2e_wedge_loop.py)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite (pytest)
        run: python -m pytest

      # Independent, explicit proof (on top of the full-suite run above)
      # that the DoD B.9 e2e genuinely EXECUTED its 3 cases in this CI run
      # rather than silently skipping — fails the job loudly if it sees
      # any SKIPPED report for this file, which should be structurally
      # impossible given `_require_node`'s hard-fail-not-skip behavior,
      # but this step makes that guarantee independently checkable from
      # the CI log itself rather than only from the source.
      - name: Verify DoD B.9 wedge-loop e2e actually ran (not skipped)
        run: |
          set -euo pipefail
          python -m pytest tests/orchestrator/test_e2e_wedge_loop.py -v | tee /tmp/e2e-wedge-loop.log
          if grep -q "SKIPPED" /tmp/e2e-wedge-loop.log; then
            echo "::error::DoD B.9 wedge-loop e2e reported a SKIPPED case — this must never happen in CI (node is required, see the 'Set up Node' step above)."
            exit 1
          fi
          grep -q "3 passed" /tmp/e2e-wedge-loop.log

      - name: tessctl doctor (SHA-integrity gate)
        env:
          TESS_ROOT: ${{ github.workspace }}
        run: python3 .tess/bin/tessctl doctor

      - name: tessctl verify (security-tier gate)
        env:
          TESS_ROOT: ${{ github.workspace }}
        run: python3 .tess/bin/tessctl verify

  create-tess:
    name: create-tess tests (node ${{ matrix.node-version }}${{ matrix.npm-version && format(', npm {0}', matrix.npm-version) || '' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: create-tess
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '24']
        include:
          # The exact npm publish-npm.yml publishes with (its NPM_VERSION).
          # Keep the two in step: tests/test_v021_release_pipeline.py checks it.
          - node-version: '24'
            npm-version: '12.1.0'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: create-tess/package-lock.json

      - name: Install pinned npm
        if: matrix.npm-version
        env:
          NPM_VERSION: ${{ matrix.npm-version }}
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite (node --test)
        run: npm test

  # A stock Mac: /usr/bin/python3 is Apple's 3.9 with no PyYAML. pytest runs
  # on a setup-python interpreter (3.9 and 3.12); the packed-tarball scaffold
  # test and the fresh-install e2e run the wizard with /usr/bin/python3 first
  # on PATH, so tessctl and onboarding must work without any pip install.
  macos:
    name: macOS (py${{ matrix.python-version }}, stock /usr/bin/python3 install)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Stock /usr/bin/python3 really lacks PyYAML
        run: |
          /usr/bin/python3 --version
          if /usr/bin/python3 -c 'import yaml' 2>/dev/null; then
            echo "::error::this runner's /usr/bin/python3 has PyYAML; the stock-macOS leg would prove nothing"
            exit 1
          fi

      - name: Run test suite (pytest)
        run: python -m pytest

      - name: create-tess tests, wizard on stock /usr/bin/python3
        working-directory: create-tess
        env:
          TESS_TEST_PYTHON: /usr/bin/python3
        run: |
          npm ci
          npm test

      - name: Fresh-install e2e from the packed tarball, stock /usr/bin/python3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          (cd create-tess && npm pack --pack-destination "$RUNNER_TEMP/pack" >/dev/null)
          export TESS_E2E_TARBALL="$(ls "$RUNNER_TEMP"/pack/create-tess-*.tgz)"
          TESS_BRAIN_E2E=1 TESS_E2E_PYTHON=/usr/bin/python3 python -m pytest -q tests/test_brain_fresh_install_e2e.py

  # The opt-in fresh-install e2e (tests/test_brain_fresh_install_e2e.py), run
  # from the real `npm pack` tarball on Linux too.
  fresh-install-e2e:
    name: fresh-install e2e (packed tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Fresh-install e2e from the packed tarball
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          (cd create-tess && npm pack --pack-destination "$RUNNER_TEMP/pack" >/dev/null)
          export TESS_E2E_TARBALL="$(ls "$RUNNER_TEMP"/pack/create-tess-*.tgz)"
          TESS_BRAIN_E2E=1 python -m pytest -v tests/test_brain_fresh_install_e2e.py | tee "$RUNNER_TEMP/e2e.log"
          if grep -q SKIPPED "$RUNNER_TEMP/e2e.log"; then echo "::error::fresh-install e2e skipped"; exit 1; fi

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Run the gitleaks CLI directly. The gitleaks-action@v2 wrapper now requires
      # a paid GITLEAKS_LICENSE secret for GitHub *organization*-owned repos (this
      # repo is org-owned), so the wrapper is not used. The CLI is free and applies
      # the committed .gitleaks.toml allowlist.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # `gitleaks git <path>` with NO --log-opts does not just scan this ref's
      # own ancestry — on a fetch-depth:0 clone (needed so `origin/<base>` and
      # historic commits are available at all) it falls back to walking every
      # ref reachable in the local object store. Verified: on this repo's own
      # main, `git log HEAD --oneline | wc -l` reports 45 commits, but
      # `gitleaks git .` with no --log-opts reports "184 commits scanned" —
      # i.e. it silently scans every other branch fetched alongside main too.
      # That is the false-positive: an unrelated open PR's own (allowlisted,
      # on ITS branch) test fixture can fail THIS ref's scan even though it
      # never touches this ref's history. An explicit --log-opts commit range
      # scopes gitleaks correctly (proven: HEAD~2..HEAD scans exactly 2
      # commits, no cross-branch leakage) — so always pass one:
      #   - pull_request: only the PR's own commits, base..head
      #   - push:         only the commits this push introduced, before..after
      #   - push with no "before" (brand-new branch/tag): fall back to just
      #     the tip commit — there is no prior ref to diff against
      - name: Compute scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="${BEFORE_SHA}..${HEAD_SHA}"
          else
            LOG_OPTS="-1"
          fi
          echo "Scanning range: $LOG_OPTS"
          echo "log_opts=${LOG_OPTS}" >> "$GITHUB_OUTPUT"

      - name: gitleaks (this ref's own commits only)
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: gitleaks git . --config .gitleaks.toml --log-opts="${LOG_OPTS}" --redact --no-banner --exit-code 1
