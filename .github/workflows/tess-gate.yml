# tess-gate-ci v5
# Installed/upgraded by `tessctl gate install-hooks`. CI entrypoint for the
# gate spine (docs/ULTIMATE_FRAMEWORK_PLAN.md Design Decision #2/#6) — the
# harness-independent backstop that still catches `git push --no-verify`.
#
# Phase 2b (CI auto-enforce, closes the Fable Phase-2 residual "the CI
# workflow is workflow_dispatch-only — advisory, not auto-enforcing"):
# triggers automatically on `push` to protected branches and on
# `pull_request`. The authoritative workflow deliberately has NO
# `workflow_dispatch`: caller-selected refs must never create the required
# `tessctl gate ci` check context. This makes the ship-gate BLOCK a
# failing PR/merge automatically rather than requiring someone to remember
# to run it. A CI check alone is only ADVISORY until it is also configured
# as a required status check in branch protection — see
# conductor/verdict-signing.md and README.md's `tessctl gate` section for
# the exact branch-protection setup this needs to actually PREVENT a merge
# (required check name: the job name below, "tessctl gate ci").
#
# v3 FIX (honesty-capstone-audit-2026-07-08 §3-c — "same-push engine
# tamper"): v2 and earlier ran `python3 .tess/bin/tessctl gate ci` straight
# from the PUSHED checkout. An attacker who edits the gate's own decision
# logic (e.g. `_gate_run_ship_check` in .tess/bin/tessctl) to unconditionally
# report "not blocked", in the SAME push as an unreviewed payload, would keep
# this required check green — the tampered engine is exactly what evaluates
# whether the tamper itself should be blocked, so no policy rule alone can
# catch it (the engine is what READS the policy). Fix: this job now extracts
# and runs the engine as it existed at the push's BASE ref — never the
# pushed tree's own copy — so a same-push engine edit is evaluated by an
# engine an attacker never touched. `core/policy/policy.yaml`'s
# `tess-os-security-tier-doctrine` rule now ALSO covers `.tess/bin/**` (the
# engine) and `.tess/gate/signoffs/**` (§3-d) as a second, independent layer:
# even setting the trusted-engine fix aside, an edit to the engine itself is
# `prod_touching` and needs its own covering, signed Reid/Cyra verdict.
# BOOTSTRAP NOTE: if the base ref predates the gate's adoption (no
# `.tess/bin/tessctl` at BASE — e.g. this is the very first commit
# introducing the gate), there is no trusted engine to extract and this job
# FAILS CLOSED (refuses) rather than falling back to trusting the pushed
# tree's own engine — see the "Extract trusted gate engine" step below.
#
# v4 EVENT-PROVENANCE FIX: BASE/HEAD come only from immutable
# `github.event` fields. The trusted BASE engine independently compares its
# CLI range with GITHUB_EVENT_PATH before granting authoritative renderer
# admission. Manual/local calls are diagnostic-only; workflow_dispatch is
# rejected. An all-zero push `before` SHA fails with REMOTE_BASE_REQUIRED —
# Git's empty-tree object is not a commit and is never renderer authority.
#
# v5 MERGE-PREVIEW TOPOLOGY: authoritative admission always evaluates an
# exact two-parent merge wrapper. For pull requests, BASE is
# `pull_request.base.sha`, the attestation HEAD is `pull_request.head.sha`,
# and evaluation HEAD is `GITHUB_SHA` on exactly `refs/pull/<n>/merge`. For a
# main push, BASE is `before`, evaluation HEAD is `after`/`GITHUB_SHA`, and
# the attestation HEAD is its second parent. Ordered parents must be exactly
# [BASE, attestation HEAD], and both commits must have the same tree. Squash,
# rebase, fast-forward, octopus, reordered/divergent merges, merge queues,
# arbitrary refs/tags, and conflict-resolution bytes fail closed. This
# requires merge-commit-only + strict-up-to-date repository settings; see
# docs/GITHUB_MERGE_TOPOLOGY.md.
#
# BOOTSTRAP WARNING for a fresh adopter: if your project's core/policy/
# policy.yaml rules already have real (non-placeholder) globs but no
# covering, VALIDLY-SIGNED APPROVE verdict yet exists for the paths they
# match, your FIRST push/PR touching those paths WILL be blocked — this is
# the gate working as designed (fail-closed), not a bug. If you need a
# grace period while you write your project's initial covering verdicts,
# do so before installing this required check; never add caller-selected
# inputs to the authoritative job.
name: Tess OS ship-gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ship-gate:
    name: tessctl gate ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.7"

      - name: Resolve immutable admission objects for this trigger
        id: refs
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            ATTESTATION="${{ github.event.pull_request.head.sha }}"
            EVALUATION="$GITHUB_SHA"
            PR_NUMBER="${{ github.event.number }}"
            if [ "$GITHUB_REF" != "refs/pull/${PR_NUMBER}/merge" ]; then
              echo "::error::CI_EVENT_REF_MISMATCH: pull_request gate must run on its exact refs/pull/<n>/merge ref."
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BASE="${{ github.event.before }}"
            EVALUATION="${{ github.event.after }}"
            ATTESTATION=""
            PR_NUMBER=""
            if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$EVALUATION" != "$GITHUB_SHA" ]; then
              echo "::error::CI_EVENT_REF_MISMATCH: push gate accepts only exact refs/heads/main before/after context."
              exit 1
            fi
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "::error::REMOTE_BASE_REQUIRED: push event has no pre-existing commit BASE; the empty-tree object is never renderer authority."
              exit 1
            fi
          else
            echo "::error::CI_EVENT_SOURCE_REQUIRED: authoritative ship-gate accepts only push or pull_request events."
            exit 1
          fi
          {
            echo "base=$BASE"
            echo "attestation=$ATTESTATION"
            echo "evaluation=$EVALUATION"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch and pin exact event objects
        id: objects
        run: |
          set -euo pipefail
          BASE="${{ steps.refs.outputs.base }}"
          ATTESTATION="${{ steps.refs.outputs.attestation }}"
          EVALUATION="${{ steps.refs.outputs.evaluation }}"
          PR_NUMBER="${{ steps.refs.outputs.pr_number }}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --force origin \
              "$BASE" \
              "+refs/pull/${PR_NUMBER}/head:refs/tess/admission-head" \
              "+refs/pull/${PR_NUMBER}/merge:refs/tess/admission-merge"
            test "$(git rev-parse refs/tess/admission-head)" = "$ATTESTATION"
            test "$(git rev-parse refs/tess/admission-merge)" = "$EVALUATION"
          else
            git fetch --no-tags --force origin "$BASE" "$EVALUATION"
            ATTESTATION="$(git rev-parse "${EVALUATION}^2")"
          fi
          git cat-file -e "${BASE}^{commit}"
          git cat-file -e "${ATTESTATION}^{commit}"
          git cat-file -e "${EVALUATION}^{commit}"
          echo "attestation=$ATTESTATION" >> "$GITHUB_OUTPUT"

      - name: Extract trusted gate dependencies (base ref only)
        id: trusted_dependencies
        run: |
          set -euo pipefail
          BASE="${{ steps.refs.outputs.base }}"
          REQUIREMENTS_REL=".tess/ci/ship-gate-requirements.txt"
          TRUSTED_DIR="$(mktemp -d)"
          TRUSTED_REQUIREMENTS="$TRUSTED_DIR/ship-gate-requirements.txt"
          if git cat-file -e "${BASE}:${REQUIREMENTS_REL}" 2>/dev/null; then
            git show "${BASE}:${REQUIREMENTS_REL}" > "$TRUSTED_REQUIREMENTS"
            chmod 0444 "$TRUSTED_REQUIREMENTS"
            echo "requirements_path=$TRUSTED_REQUIREMENTS" >> "$GITHUB_OUTPUT"
          else
            echo "::error::TRUST_BOOTSTRAP_REQUIRED: immutable BASE has no pinned ship-gate dependency requirements. Refusing candidate-derived or unhashed dependencies; adopt the reviewed bootstrap stack out of band first."
            exit 1
          fi

      - name: Install exact trusted gate dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "${{ steps.trusted_dependencies.outputs.requirements_path }}"

      - name: Extract trusted gate engine (base ref only — never the pushed tree)
        id: trusted_engine
        run: |
          set -euo pipefail
          BASE="${{ steps.refs.outputs.base }}"
          TRUSTED_DIR="$(mktemp -d)"
          if git cat-file -e "$BASE:.tess/bin/tessctl" 2>/dev/null; then
            git show "$BASE:.tess/bin/tessctl" > "$TRUSTED_DIR/tessctl"
            chmod +x "$TRUSTED_DIR/tessctl"
            echo "engine_path=$TRUSTED_DIR/tessctl" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tess-gate-ci: no gate engine found at base ref '$BASE' — refusing to fall back to the PUSHED tree's own engine (honesty-capstone-audit-2026-07-08 §3-c, same-push engine-tamper fix). A tampered .tess/bin/tessctl in this push must never be trusted to evaluate itself; a missing baseline engine fails closed instead."
            exit 1
          fi

      - name: tessctl gate ci (trusted base-ref engine; untrusted pushed tree)
        env:
          TESS_ROOT: ${{ github.workspace }}
        run: |
          python3 "${{ steps.trusted_engine.outputs.engine_path }}" gate ci \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.evaluation }}"
