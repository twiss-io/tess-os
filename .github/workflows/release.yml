name: Release

# Fires only on version tags (e.g. v1.0.0, v0.2.1-rc1).
on:
  push:
    tags:
      - 'v*'

# Releases are serialized; never cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # v1.0.0 security review (M5): every gate runs in this READ-ONLY job, and its
  # checkout keeps no credentials, so no test, script or dependency it runs
  # ever holds a write token. Only the `release` job below, which runs no
  # project code, gets contents: write.
  gates:
    name: Release gates (read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # actions/checkout re-points refs/tags/<tag> at the tagged COMMIT
      # (it fetches +<sha>:refs/tags/<tag>), so an annotated tag arrives as a
      # lightweight one and Gate 1 would always see a 'commit'. Re-fetch the
      # real tag object first. The tag name only ever reaches the shell
      # through the TAG environment variable, never through an inline
      # expression, so a crafted tag name cannot inject shell.
      - name: Restore the annotated tag object
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          echo "refs/tags/${TAG} is now a '$(git cat-file -t "refs/tags/${TAG}")'"

      # ----------------------------------------------------------------------
      # Gate 1 — the tag MUST be a signed, annotated tag verified by the
      # provisioned signer public key.  TESS_SIGNING_PUBKEY is MANDATORY:
      # the job fails immediately if it is not set so that git verify-tag
      # always runs.  The grep-only 'signature block present' fallback has
      # been removed — cryptographic verification is the only gate (D4).
      # ----------------------------------------------------------------------
      - name: Gate 1 — verify the tag is signed
        env:
          TAG: ${{ github.ref_name }}
          TESS_SIGNING_PUBKEY: ${{ secrets.TESS_SIGNING_PUBKEY }}
        run: |
          set -euo pipefail
          echo "Inspecting tag: $TAG"

          obj_type="$(git cat-file -t "$TAG" 2>/dev/null || echo missing)"
          if [ "$obj_type" != "tag" ]; then
            echo "::error::'$TAG' is a '${obj_type}', not an annotated tag." \
                 "A signed annotated tag is required (git tag -s $TAG)."
            exit 1
          fi

          if [ -z "${TESS_SIGNING_PUBKEY:-}" ]; then
            echo "::error::TESS_SIGNING_PUBKEY secret is not set. Full cryptographic"
            echo "         verification is mandatory — add the signer's public key as"
            echo "         the TESS_SIGNING_PUBKEY repository secret and retry."
            exit 1
          fi

          echo "Signer public key provisioned — running full cryptographic verification."
          printf '%s\n' "$TESS_SIGNING_PUBKEY" | gpg --import
          git verify-tag "$TAG"
          echo "OK: '$TAG' signature cryptographically verified against the provisioned key."

      # Gate 1b — the signer must be the PINNED release key (tess.lock
      # framework.trusted_key_fingerprint), not merely whatever key the
      # TESS_SIGNING_PUBKEY secret holds.
      - name: Gate 1b — tag signed by the pinned release key
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/verify_release_tag.sh "$TAG"

      # Gate 1d — the tag must ALSO carry the SSH release signature (pinned
      # tess.lock framework.trusted_ssh_key_fingerprint) over the manifest of
      # this exact tag + commit + tree. Installs without gpg verify updates
      # with it (`ssh-keygen -Y verify`), so a release without it must not ship.
      - name: Gate 1d — tag carries the pinned SSH release signature
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/verify_release_ssh_sig.sh "$TAG"

      # Gate 1c — tag, both package.json files, tess.lock framework.version
      # and a CHANGELOG section must all name the same version (fails, never warns).
      - name: Gate 1c — every version agrees with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_version_gate.py "$TAG"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Gate 2 — the full test suite must pass, and the first-push release
      # proof (tests/test_v1_first_push_release_proof.py) must RUN: it skips
      # without create-tess/node_modules, so install it first and refuse a skip.
      - name: Gate 2 — full test suite (pytest)
        run: |
          set -euo pipefail
          npm ci --prefix create-tess
          python -m pytest -rs | tee "$RUNNER_TEMP/pytest.log"
          if grep -E "SKIPPED.*test_v1_first_push_release_proof" "$RUNNER_TEMP/pytest.log"; then
            echo "::error::tests/test_v1_first_push_release_proof.py was skipped; it must run before a release"
            exit 1
          fi

      - name: Gate 2b — tessctl doctor
        env:
          TESS_ROOT: ${{ github.workspace }}
        run: python3 .tess/bin/tessctl doctor

      - name: Gate 2c — tessctl verify
        env:
          TESS_ROOT: ${{ github.workspace }}
        run: python3 .tess/bin/tessctl verify

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Gate 2d — the wizard's own suite, which includes a scaffold from the
      # real `npm pack` tarball (.gitignore restored, private paths ignored).
      - name: Gate 2d — create-tess tests (npm test)
        working-directory: create-tess
        run: |
          npm ci
          npm test

      # Gate 2e — fresh install from the packed tarball, onboarding, first
      # commit through the gate, doctor/verify (tests/test_brain_fresh_install_e2e.py).
      - name: Gate 2e — fresh-install e2e from the packed tarball
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          (cd create-tess && npm pack --pack-destination "$RUNNER_TEMP/pack" >/dev/null)
          export TESS_E2E_TARBALL="$(ls "$RUNNER_TEMP"/pack/create-tess-*.tgz)"
          TESS_BRAIN_E2E=1 python -m pytest -q tests/test_brain_fresh_install_e2e.py

      # Gate 3 — no secret content anywhere in the history.
      #
      # Run the gitleaks CLI directly. The gitleaks-action@v2 wrapper now requires
      # a paid GITLEAKS_LICENSE secret for GitHub *organization*-owned repos (this
      # repo is org-owned), so the wrapper is not used. The CLI is free and applies
      # the committed .gitleaks.toml allowlist to the full git history.
      # L3 (v1.0.0 security review): the tarball must match the pinned sha256
      # (gitleaks_8.30.1_checksums.txt; the GitHub release asset digest agrees).
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
          gitleaks version

      # Scans the full history reachable from the tag. Without --log-opts,
      # gitleaks runs `git log --all`, which also scans every other fetched
      # branch, so an unrelated branch could fail (or pass) the release.
      - name: Gate 3 — secret scan (gitleaks, full history of the tag)
        env:
          TAG: ${{ github.ref_name }}
        run: gitleaks git . --config .gitleaks.toml --log-opts="$TAG" --redact --no-banner --exit-code 1

      # ----------------------------------------------------------------------
      # Gate 4 — secret-scrub assertion: no vault/secret PATHS may be tracked.
      # Complements gitleaks (which scans content) by forbidding the path
      # shapes that hold credentials per .gitignore. Allows .env.example and
      # the two safe vault scaffold files (.gitkeep + vault.registry.json).
      #
      # Re-anchored from cmd_publish (local, no remote push) to release CI —
      # Cyra finding (a), HIGH: the REAL public-release scrub gate must be here.
      # cmd_publish (tessctl) does NOT run a secondary scan — this is the
      # sole path-scrub gate. (Design: conductor/vault.md; §6 Layer 5.)
      # ----------------------------------------------------------------------
      - name: Gate 4 — secret-scrub assertion (no vault/secret paths)
        run: |
          set -euo pipefail
          echo "Scanning tracked files for forbidden vault/secret paths..."
          hits="$(
            git ls-files \
              | grep -E '(^|/)(vault|tess-secrets|secrets)/|(^|/)\.env($|\.)|\.(key|pem|age|env\.json)$' \
              | grep -vE '(^|/)\.env\.example$' \
              | grep -vE '(^|/)vault\.registry\.json$' \
              | grep -vE '(^|/)\.gitkeep$' \
              || true
          )"
          if [ -n "$hits" ]; then
            echo "::error::secret-scrub FAILED — forbidden vault/secret paths are tracked:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "OK: no vault/secret paths are tracked."

      # ----------------------------------------------------------------------
      # Gate 5 — vault registry integrity: vault.registry.json must be valid
      # JSON and must NOT contain actual secret values (--strict schema check).
      # This is the M5 scrub gate anchored to the real public-release path.
      # Cyra finding (a), §6 Layer 5: doctor --strict as release CI assertion.
      # ----------------------------------------------------------------------
      - name: Gate 5 — vault registry integrity (doctor --strict)
        run: |
          set -euo pipefail
          echo "Checking vault.registry.json for value-shaped fields..."
          REGISTRY=".claude/vault/vault.registry.json"
          if [ ! -f "$REGISTRY" ]; then
            echo "::warning::vault.registry.json not found — skipping registry check."
            exit 0
          fi
          python3 -c "
          import json, re, sys

          with open('$REGISTRY') as f:
              data = json.load(f)

          # Reject any field named 'value', 'secret', 'password', 'api_key', 'token'
          # with a non-empty string value of >= 8 chars (actual credential shape)
          registry_str = json.dumps(data)
          suspicious = re.findall(
              r'\"(?:value|secret|password|api_key|token)\"\s*:\s*\"([^\"]{8,})\"',
              registry_str
          )
          if suspicious:
              print(f'FAIL: vault.registry.json contains {len(suspicious)} value-shaped field(s).')
              print('The registry MUST be a catalog only — no actual secret values.')
              sys.exit(1)
          print(f'OK: vault.registry.json passes --strict schema check.')
          "

  release:
    name: Publish the GitHub Release
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write       # required to publish the GitHub Release
    steps:
      - name: Checkout the tag (release notes source; no credentials kept)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The release notes are the curated summary of this version's CHANGELOG
      # section: the text between the release-notes markers inside
      # '## [<version>]'. Without markers, the whole section is used (capped
      # below GitHub's body limit). GitHub's generated PR list is appended.
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          python3 - "$VERSION" "$NOTES" <<'PY'
          import re, sys
          version, out = sys.argv[1], sys.argv[2]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not m:
              print(f"::error::no CHANGELOG section for {version}")
              sys.exit(1)
          else:
              section = m.group(1)
              c = re.search(r"<!-- release-notes:start -->\n(.*?)<!-- release-notes:end -->", section, re.S)
              body = (c.group(1) if c else section).strip()
              if len(body) > 100000:
                  body = body[:100000] + "\n\n(truncated; full text in CHANGELOG.md)"
          open(out, "w", encoding="utf-8").write(body + "\n")
          print(f"release notes: {len(body)} chars")
          PY

      # All gates passed — publish the release. This step only runs because
      # every preceding gate succeeded (steps fail fast), so the release is gated.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: false
