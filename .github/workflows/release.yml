name: Release

# Pull requests and blank manual runs rehearse without release credentials.
# A production release is an explicit dispatch from protected main with a
# stable, already-created signed tag. Tag pushes never execute release code.
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/publish-npm.yml'
      - 'scripts/release_preflight.py'
      - 'tests/test_release_preflight.py'
      - 'package.json'
      - 'create-tess/**'
      - 'gui/**'
      - '.tess/tess.lock'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Signed stable tag to release (vX.Y.Z); leave blank to rehearse'
        required: false
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rehearse:
    name: Credential-free release rehearsal
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            create-tess/package-lock.json
            gui/package-lock.json

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Current main is intentionally expected to report NOT READY until the
      # 0.1.0/0.1.1 metadata debt is reconciled in a separately reviewed release
      # preparation change. Advisory mode reports that debt without hiding it or
      # turning this hardening PR red.
      - name: Report release metadata readiness
        run: python scripts/release_preflight.py metadata --advisory

      - name: Verify workflow trust boundaries
        run: python scripts/release_preflight.py workflows

      - name: Credential-free pack manifest rehearsal
        run: python scripts/release_preflight.py packs

      - name: Full Python test suite
        run: python -m pytest

      - name: tessctl doctor
        env:
          TESS_ROOT: ${{ github.workspace }}
        run: python .tess/bin/tessctl doctor

      - name: tessctl verify
        env:
          TESS_ROOT: ${{ github.workspace }}
        run: python .tess/bin/tessctl verify

      - name: Install and test create-tess
        working-directory: create-tess
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Install and test private GUI
        working-directory: gui
        run: |
          npm ci --ignore-scripts
          npm test

  release_preflight:
    name: Signed protected release preflight
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      checks: read
    outputs:
      release_tag: ${{ steps.source.outputs.release_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag_object_sha: ${{ steps.source.outputs.tag_object_sha }}
    steps:
      # This checkout is the trusted control plane. The release environment's
      # deployment-branch policy must restrict this job to protected main.
      - name: Checkout trusted release control from main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      # Candidate contents are separate. All identity gates are executed by
      # control/scripts/release_preflight.py, never by candidate code.
      - name: Checkout candidate tag with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.release_tag }}
          path: candidate
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch protected main in candidate repository
        working-directory: candidate
        run: git fetch --force origin +refs/heads/main:refs/remotes/origin/main

      - name: Gate 1 — tag source equals dispatched and fetched protected main
        id: source
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python control/scripts/release_preflight.py source \
            --repo candidate \
            --tag "$TAG" \
            --main-ref origin/main \
            --expected-sha "$EXPECTED_SHA"
          source_sha="$(git -C candidate rev-parse "$TAG^{commit}")"
          tag_object_sha="$(git -C candidate rev-parse "$TAG^{tag}")"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag_object_sha=$tag_object_sha" >> "$GITHUB_OUTPUT"

      # Both values are configured outside candidate repository files on the
      # protected GitHub `release` environment. The lock fingerprint serves the
      # runtime updater and is deliberately not a release signer allowlist.
      - name: Gate 2 — exact protected signer identity
        env:
          TAG: ${{ inputs.release_tag }}
          TESS_SIGNING_PUBKEY: ${{ secrets.TESS_SIGNING_PUBKEY }}
          TESS_RELEASE_SIGNER_FINGERPRINT: ${{ vars.TESS_RELEASE_SIGNER_FINGERPRINT }}
        run: python control/scripts/release_preflight.py signer --repo candidate --tag "$TAG"

      - name: Gate 3 — unified stable release version contract
        env:
          TAG: ${{ inputs.release_tag }}
        run: python control/scripts/release_preflight.py metadata --repo candidate --tag "$TAG"

      - name: Gate 4 — workflow and npm publish boundaries
        run: python control/scripts/release_preflight.py workflows --repo candidate

      # No unchecked scanner is downloaded here. Trusted control follows the
      # Actions API chain from the exact workflow file/id through the latest
      # push run/attempt, job, check suite, and GitHub Actions app identity.
      - name: Gate 5 — provenance-bound upstream secret scan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          python control/scripts/release_preflight.py actions \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-path .github/workflows/ci.yml \
            --workflow-name CI \
            --event push \
            --branch main \
            --sha "$SOURCE_SHA" \
            --job 'secret scan (gitleaks)'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: candidate/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            candidate/create-tess/package-lock.json
            candidate/gui/package-lock.json

      - name: Install Python test dependencies
        working-directory: candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Gate 6 — full Python test suite
        working-directory: candidate
        run: python -m pytest

      - name: Gate 7 — tessctl doctor
        working-directory: candidate
        env:
          TESS_ROOT: ${{ github.workspace }}/candidate
        run: python .tess/bin/tessctl doctor

      - name: Gate 8 — tessctl verify
        working-directory: candidate
        env:
          TESS_ROOT: ${{ github.workspace }}/candidate
        run: python .tess/bin/tessctl verify

      - name: Gate 9 — create-tess tests
        working-directory: candidate/create-tess
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Gate 10 — private GUI tests
        working-directory: candidate/gui
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Gate 11 — credential-free pack manifest assertions
        run: python control/scripts/release_preflight.py packs --repo candidate

      - name: Gate 12 — secret-bearing path scrub
        run: |
          set -euo pipefail
          hits="$(
            git -C candidate ls-files \
              | grep -E '(^|/)(vault|tess-secrets|secrets)/|(^|/)\.env($|\.)|\.(key|pem|age|env\.json)$' \
              | grep -vE '(^|/)\.env\.example$' \
              | grep -vE '(^|/)vault\.registry\.json$' \
              | grep -vE '(^|/)\.gitkeep$' \
              || true
          )"
          if [ -n "$hits" ]; then
            echo '::error::forbidden vault or secret paths are tracked'
            printf '%s\n' "$hits"
            exit 1
          fi

      - name: Gate 13 — vault registry contains no value-shaped secrets
        working-directory: candidate
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          registry = Path('.claude/vault/vault.registry.json')
          if not registry.is_file():
              raise SystemExit('vault.registry.json is required for release')
          data = json.loads(registry.read_text(encoding='utf-8'))
          suspicious = re.findall(
              r'"(?:value|secret|password|api_key|token)"\s*:\s*"([^"]{8,})"',
              json.dumps(data),
          )
          if suspicious:
              raise SystemExit('vault registry contains value-shaped secret fields')
          print('OK: vault registry is catalog-only')
          PY

  publish_release:
    name: Publish GitHub Release
    needs: release_preflight
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      # Re-check the exact annotated tag object immediately before release.
      # Repository rules must additionally forbid v* tag updates/deletions so
      # this identity cannot race between the check and the API creation.
      - name: Verify release tag ref did not move after preflight
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.release_preflight.outputs.tag_object_sha }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release_preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          actual_tag_object="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --jq '.object.sha' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}"
          )"
          if [ "$actual_tag_object" != "$EXPECTED_TAG_OBJECT" ]; then
            echo '::error::release tag moved after signed preflight'
            exit 1
          fi

      # This is the only publication step. No candidate code runs in this job,
      # and it is unreachable until the read-only preflight succeeds.
      - name: Publish verified GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.release_preflight.outputs.release_tag }}
          target_commitish: ${{ needs.release_preflight.outputs.source_sha }}
          generate_release_notes: true
          fail_on_unmatched_files: false
