# tess-gate-ci v4
# Installed/upgraded by `tessctl gate install-hooks`. CI entrypoint for the
# gate spine (docs/ULTIMATE_FRAMEWORK_PLAN.md Design Decision #2/#6) — the
# harness-independent backstop that still catches `git push --no-verify`.
#
# Phase 2b (CI auto-enforce, closes the Fable Phase-2 residual "the CI
# workflow is workflow_dispatch-only — advisory, not auto-enforcing"):
# triggers automatically on `push` to protected branches and on
# `pull_request`, IN ADDITION TO `workflow_dispatch` (kept for ad hoc/manual
# re-checks of an arbitrary ref range). This makes the ship-gate BLOCK a
# failing PR/merge automatically rather than requiring someone to remember
# to run it. A CI check alone is only ADVISORY until it is also configured
# as a required status check in branch protection — see
# conductor/verdict-signing.md and README.md's `tessctl gate` section for
# the exact branch-protection setup this needs to actually PREVENT a merge
# (required check name: the job name below, "tessctl gate ci").
#
# v3 FIX (honesty-capstone-audit-2026-07-08 §3-c — "same-push engine
# tamper"): v2 and earlier ran `python3 .tess/bin/tessctl gate ci` straight
# from the PUSHED checkout. An attacker who edits the gate's own decision
# logic (e.g. `_gate_run_ship_check` in .tess/bin/tessctl) to unconditionally
# report "not blocked", in the SAME push as an unreviewed payload, would keep
# this required check green — the tampered engine is exactly what evaluates
# whether the tamper itself should be blocked, so no policy rule alone can
# catch it (the engine is what READS the policy). Fix: this job now extracts
# and runs the engine as it existed at the push's BASE ref — never the
# pushed tree's own copy — so a same-push engine edit is evaluated by an
# engine an attacker never touched. `core/policy/policy.yaml`'s
# `tess-os-security-tier-doctrine` rule now ALSO covers `.tess/bin/**` (the
# engine) and `.tess/gate/signoffs/**` (§3-d) as a second, independent layer:
# even setting the trusted-engine fix aside, an edit to the engine itself is
# `prod_touching` and needs its own covering, signed Reid/Cyra verdict.
# v4 FIRST PUSH (2026-09-29 Codex review): a push with NO base commit (a new
# repository's first push) has no earlier engine to extract, so v3 failed
# every fresh install's first CI run. v4 still never runs the pushed tree's
# engine: it reads the tag name from the pushed `.tess/release-proof.json`,
# fetches THAT tag from the Tess OS release repository below, and checks the
# tag's OpenPGP AND SSH signatures against release-key fingerprints written
# into this file (it came from the signed release, and the gate itself
# requires .github/workflows/** to equal the release bytes on a first push).
# Only then does it run the signed release's engine against the push. A push
# with no base and no release proof, or whose tag does not verify, FAILS
# CLOSED. If the base ref exists but has no `.tess/bin/tessctl` (the gate is
# being adopted into an existing history), the job also fails closed.
# RESIDUAL RISK: GitHub runs the workflow file from the pushed commit, so a
# push that rewrites this file can skip the check entirely. That is true of
# every push, not just the first; a required status check does not stop it —
# review .github/workflows/** changes (they are security-tier).
#
# BOOTSTRAP WARNING for a fresh adopter: if your project's core/policy/
# policy.yaml rules already have real (non-placeholder) globs but no
# covering, VALIDLY-SIGNED APPROVE verdict yet exists for the paths they
# match, your FIRST push/PR touching those paths WILL be blocked — this is
# the gate working as designed (fail-closed), not a bug. If you need a
# grace period while you write your project's initial covering verdicts,
# temporarily remove the `push`/`pull_request` triggers below (leave
# `workflow_dispatch`) and re-add them once you have at least one real,
# signed covering verdict per rule.
name: Tess OS ship-gate

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base ref to diff from"
        required: true
        default: "origin/main"
      head:
        description: "Head ref to diff to"
        required: true
        default: "HEAD"
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ship-gate:
    name: tessctl gate ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Resolve base/head for this trigger
        id: refs
        run: |
          EMPTY_TREE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE="${{ inputs.base }}"
            HEAD="${{ inputs.head }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$EMPTY_TREE"
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Extract trusted gate engine (base ref only — never the pushed tree)
        id: trusted_engine
        env:
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          BASE="${{ steps.refs.outputs.base }}"
          EMPTY_TREE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          TRUSTED_DIR="$(mktemp -d)"
          if [ "$BASE" = "$EMPTY_TREE" ]; then
            # Base-less push: take the engine from the signed release tag the
            # pushed release proof names — never from the pushed tree.
            TESS_RELEASE_REPO="https://github.com/twiss-io/tess-os.git"
            python3 -I -B - "$TESS_RELEASE_REPO" "$HEAD_SHA" "$TRUSTED_DIR" <<'TESS_BOOTSTRAP_PY'
          import base64, hashlib, json, os, re, subprocess, sys, tempfile
          REPO, HEAD, OUT = sys.argv[1], sys.argv[2], sys.argv[3]
          PGP_FP = "EBEABC618C11B6A7340A7D1601DD637667B8CC89"
          SSH_FP = "SHA256:2G0Xp5X+54NdmGbIOBhWicNlhU/Law9WpWisuAitBoI"
          MIN_VERSION = (1, 0, 0)
          FORMAT = "tess-release-manifest/1"
          MARKER = "Tess-Release-SSH-Signature: tess-release-manifest/1"
          PRINCIPAL, NAMESPACE = "twiss-release", "tess-release"
          PGP_BEGIN = b"-----BEGIN PGP SIGNATURE-----"


          def die(msg):
              print("::error::tess-gate-ci (first push): " + msg)
              sys.exit(1)


          def git(*args):
              r = subprocess.run(["git"] + list(args), capture_output=True)
              if r.returncode != 0:
                  die("git %s failed: %s" % (args[0] if args[0] != "-C" else args[2],
                                             r.stderr.decode("utf-8", "replace").strip()[:300]))
              return r.stdout


          def scratch():
              return tempfile.mkdtemp(prefix="tg", dir="/tmp" if os.path.isdir("/tmp") else None)


          if not re.fullmatch("[0-9a-f]+", HEAD) or len(HEAD) not in (40, 64):
              die("the pushed head commit id is missing or malformed")
          r = subprocess.run(["git", "show", HEAD + ":.tess/release-proof.json"], capture_output=True)
          if r.returncode != 0:
              die("this push has no base commit and no .tess/release-proof.json, so there is no "
                  "trusted gate engine to run it with. The pushed tree's own engine is never trusted "
                  "to judge itself. Push the commit Tess OS's installer created first, or push onto "
                  "an existing branch.")
          try:
              tag = json.loads(r.stdout.decode("utf-8"))["tag_name"]
          except (ValueError, KeyError, TypeError):
              die(".tess/release-proof.json is unreadable")
          m = re.fullmatch(r"v([0-9]+)[.]([0-9]+)[.]([0-9]+)([-+.][0-9A-Za-z.+-]*)?", tag if isinstance(tag, str) else "")
          if not m or len(tag) > 64:
              die("the release proof names a tag that is not a Tess OS release version")
          if tuple(int(x) for x in m.groups()[:3]) < MIN_VERSION:
              die("the release proof names %s, older than the oldest release this workflow accepts" % tag)
          rel = os.path.join(OUT, "release")
          git("init", "-q", rel)
          git("-C", rel, "fetch", "-q", "--depth=1", "--no-tags", REPO, "+refs/tags/%s:refs/tags/%s" % (tag, tag))
          tag_bytes = git("-C", rel, "cat-file", "tag", "refs/tags/" + tag)
          headers = dict(ln.split(" ", 1) for ln in tag_bytes.split(b"\n\n", 1)[0].decode("utf-8").split("\n") if " " in ln)
          commit = headers.get("object", "")
          if headers.get("type") != "commit" or headers.get("tag") != tag or not re.fullmatch("[0-9a-f]+", commit):
              die("release tag %s does not name a commit" % tag)
          commit_bytes = git("-C", rel, "cat-file", "commit", commit)
          tree = dict(ln.split(" ", 1) for ln in commit_bytes.split(b"\n\n", 1)[0].decode("utf-8").split("\n") if " " in ln).get("tree", "")
          # 1. OpenPGP: exactly one signature, made by the pinned release key.
          cut = tag_bytes.find(b"\n" + PGP_BEGIN) + 1
          if cut <= 0 or tag_bytes.find(PGP_BEGIN, cut + 1) >= 0:
              die("release tag %s has no single OpenPGP signature" % tag)
          payload = tag_bytes[:cut]
          home = scratch()
          os.chmod(home, 0o700)
          env = dict(os.environ, GNUPGHOME=home)
          with open(os.path.join(home, "p"), "wb") as fh:
              fh.write(payload)
          with open(os.path.join(home, "s"), "wb") as fh:
              fh.write(tag_bytes[cut:])
          subprocess.run(["gpg", "--batch", "--quiet", "--import"], env=env, capture_output=True,
                         input=git("-C", rel, "cat-file", "blob", commit + ":.tess/keys/twiss-release-key.asc"))
          v = subprocess.run(["gpg", "--batch", "--status-fd", "1", "--verify", os.path.join(home, "s"),
                              os.path.join(home, "p")], env=env, capture_output=True)
          status = [ln.split() for ln in v.stdout.decode("utf-8", "replace").splitlines() if ln.startswith("[GNUPG:] ")]
          kinds = [st[1] for st in status if len(st) > 1]
          valid = [st for st in status if len(st) > 2 and st[1] == "VALIDSIG"]
          if (v.returncode != 0 or "GOODSIG" not in kinds or len(valid) != 1 or valid[0][-1].upper() != PGP_FP
                  or any(k in kinds for k in ("BADSIG", "ERRSIG", "EXPSIG", "EXPKEYSIG", "REVKEYSIG"))):
              die("the OpenPGP signature on release tag %s is not by the pinned Tess OS release key" % tag)
          # 2. SSH: the release manifest signed by the pinned SSH release key.
          entries = [ln.strip() for ln in git("-C", rel, "cat-file", "blob", commit + ":.tess/keys/twiss-release-allowed-signers").decode("utf-8").splitlines() if ln.strip() and not ln.strip().startswith("#")]
          words = entries[0].split() if len(entries) == 1 else []
          if "ssh-ed25519" not in words[:-1]:
              die("release tag %s ships no single ssh-ed25519 release key" % tag)
          key_b64 = words[words.index("ssh-ed25519") + 1]
          if "SHA256:" + base64.b64encode(hashlib.sha256(base64.b64decode(key_b64)).digest()).decode("ascii").rstrip("=") != SSH_FP:
              die("the SSH release key in %s is not the pinned Tess OS release key" % tag)
          lines = payload.split(b"\n\n", 1)[-1].decode("utf-8", "replace").split("\n")
          at = [i for i, ln in enumerate(lines) if ln == MARKER]
          if len(at) != 1 or sum("Tess-Release-SSH-Signature" in ln for ln in lines) != 1:
              die("release tag %s has no single SSH release signature" % tag)
          block = []
          for ln in lines[at[0] + 1:]:
              if not ln.startswith("    "):
                  break
              block.append(ln[4:])
          if len(block) < 3 or block[0] != "-----BEGIN SSH SIGNATURE-----" or block[-1] != "-----END SSH SIGNATURE-----":
              die("the SSH release signature on %s is malformed" % tag)
          with open(os.path.join(home, "signers"), "w") as fh:
              fh.write('%s namespaces="%s" ssh-ed25519 %s\n' % (PRINCIPAL, NAMESPACE, key_b64))
          with open(os.path.join(home, "ssh.sig"), "w") as fh:
              fh.write("\n".join(block) + "\n")
          v = subprocess.run(["ssh-keygen", "-Y", "verify", "-f", os.path.join(home, "signers"), "-I", PRINCIPAL,
                              "-n", NAMESPACE, "-s", os.path.join(home, "ssh.sig")], capture_output=True,
                             input=("%s\ntag %s\nobject %s\ntree %s\n" % (FORMAT, tag, commit, tree)).encode("ascii"))
          if v.returncode != 0 or SSH_FP not in v.stdout.decode("utf-8", "replace"):
              die("the SSH signature on release tag %s is not by the pinned Tess OS release key" % tag)
          # 3. Only now: the signed release's engine.
          with open(os.path.join(OUT, "tessctl"), "wb") as fh:
              fh.write(git("-C", rel, "cat-file", "blob", commit + ":.tess/bin/tessctl"))
          print("tess-gate-ci: first push, so the gate runs the engine from signed Tess OS release "
                "%s (commit %s, OpenPGP + SSH verified), never the pushed tree's own engine." % (tag, commit))
          TESS_BOOTSTRAP_PY
            chmod +x "$TRUSTED_DIR/tessctl"
            echo "engine_path=$TRUSTED_DIR/tessctl" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "$BASE:.tess/bin/tessctl" 2>/dev/null; then
            git show "$BASE:.tess/bin/tessctl" > "$TRUSTED_DIR/tessctl"
            chmod +x "$TRUSTED_DIR/tessctl"
            echo "engine_path=$TRUSTED_DIR/tessctl" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tess-gate-ci: no gate engine found at base ref '$BASE' — refusing to fall back to the PUSHED tree's own engine (honesty-capstone-audit-2026-07-08 §3-c, same-push engine-tamper fix). A tampered .tess/bin/tessctl in this push must never be trusted to evaluate itself; a missing baseline engine fails closed instead."
            exit 1
          fi

      - name: tessctl gate ci (trusted base-ref engine; untrusted pushed tree)
        env:
          TESS_ROOT: ${{ github.workspace }}
        run: |
          python3 -I -B "${{ steps.trusted_engine.outputs.engine_path }}" gate ci \
            --base "${{ steps.refs.outputs.base }}" \
            --head "${{ steps.refs.outputs.head }}"
