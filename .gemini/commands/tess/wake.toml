5. **Report session readiness in the active session** — tell the operator, in this runtime's own output, that the session is live (per [conductor/channel-guardrails.md](conductor/channel-guardrails.md)).

**Output:** active mission state, pending decisions, blockers, and session-readiness confirmation.
